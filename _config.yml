title: Zijun Wang
author: Zijun Wang
description: "记录、探索与分享。"
url: "https://yue-s.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
permalink: /posts/:year/:month/:day/:title/

# Moonwalk is vendored locally.
theme_config:
  appearance: light
  appearance_toggle: true
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: true
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: false
  show_tags: true
  show_code_copy: true
  show_progress_bar: false
  show_back_to_top: false
  show_post_nav: true
  show_toc: true
  show_footnote_tooltips: false
  show_link_previews: false
  home:
    title_projects: 项目
    title_blog: 文章

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      lang: zh-CN
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .github
